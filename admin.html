<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IFRAH CABS Admin</title>
<style>
body{font-family:Arial;margin:0;background:#f5f7fa;color:#172033}
header{background:#111827;color:#fff;padding:18px;display:flex;justify-content:space-between}
main{max-width:1100px;margin:auto;padding:20px}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 4px 16px #0001}
input,button{padding:11px;border-radius:8px;border:1px solid #ccd3df}
button{cursor:pointer;margin:4px}
.hidden{display:none}
.booking{border-top:1px solid #ddd;padding:15px 0}
.status{font-weight:bold}
</style>
</head>
<body>
<header><b>IFRAH CABS ADMIN</b><button id="logout">Logout</button></header>
<main>
<div id="login" class="card">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br>
<button id="loginBtn">Login</button>
<p id="loginMsg"></p>
</div>

<div id="panel" class="hidden">
<div class="card">
<b>Total:</b> <span id="total">0</span>
&nbsp;&nbsp; <b>Pending:</b> <span id="pending">0</span>
</div>
<div id="bookings"></div>
</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD2yBDsxqzHmHzXy-G9r30uUuNSquDVmZYM",
  authDomain: "ifrah-cabs.firebaseapp.com",
  projectId: "ifrah-cabs",
  storageBucket: "ifrah-cabs.firebasestorage.app",
  messagingSenderId: "1058171424992",
  appId: "1:1058171424992:web:08cfe92a8ab95f014ec085"
};

const login = document.getElementById("login");
const panel = document.getElementById("panel");
const list = document.getElementById("bookings");

document.getElementById("loginBtn").onclick = async () => {
  try {
    await signInWithEmailAndPassword(
      auth,
      document.getElementById("email").value,
      document.getElementById("password").value
    );
  } catch(e) {
    document.getElementById("loginMsg").textContent = e.message;
  }
};

document.getElementById("logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  login.classList.toggle("hidden", !!user);
  panel.classList.toggle("hidden", !user);
  if (user) loadBookings();
});

function loadBookings() {
  const q = query(collection(db,"bookings"), orderBy("createdAt","desc"));
  onSnapshot(q, snap => {
    let pending = 0;
    list.innerHTML = "";
    document.getElementById("total").textContent = snap.size;

    snap.forEach(item => {
      const b = item.data();
      if ((b.status || "Pending") === "Pending") pending++;

      const div = document.createElement("div");
      div.className = "booking";
      div.innerHTML = `
        <b>${b.name || ""}</b> — ${b.serviceType || ""}<br>
        Vehicle: ${b.vehicleType || "—"}<br>
        ${b.travelDate || ""} ${b.pickupTime || ""}<br>
        ${b.pickup || ""} → ${b.drop || ""}<br>
        Passengers: ${b.passengers || ""} | Mobile: ${b.mobile || ""}<br>
        <span class="status">Status: ${b.status || "Pending"}</span><br>
        <button onclick="setStatus('${item.id}','Confirmed')">Confirm</button>
        <button onclick="setStatus('${item.id}','Cancelled')">Cancel</button>
        <button onclick="wa('${b.mobile || ""}','${b.name || ""}')">WhatsApp</button>
        <button onclick="removeBooking('${item.id}')">Delete</button>
      `;
      list.appendChild(div);
    });
    document.getElementById("pending").textContent = pending;
  });
}

window.setStatus = async (id,status) => {
  await updateDoc(doc(db,"bookings",id), {status});
};
window.removeBooking = async id => {
  if(confirm("Delete this booking?")) await deleteDoc(doc(db,"bookings",id));
};
window.wa = (mobile,name) => {
  const n = (mobile || "").replace(/\D/g,"");
  const phone = n.length === 10 ? "91"+n : n;
  window.open("https://wa.me/"+phone+"?text="+encodeURIComponent("Hello "+name+", IFRAH CABS booking update."),"_blank");
};
</script>
</body>
</html>
