<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IFRAH CABS Admin</title>
<style>body{margin:0;font-family:Arial;background:#f3f5f8;color:#172033}header{background:#07101f;color:white;padding:18px;font-size:22px;font-weight:800}main{max-width:900px;margin:auto;padding:18px}.card{background:white;padding:18px;border-radius:18px;margin:14px 0;box-shadow:0 4px 16px #0001}input{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;border:1px solid #ccd2da;border-radius:10px}button,.wa{padding:11px 15px;border:0;border-radius:10px;margin:5px 5px 0 0;font-weight:700;text-decoration:none;display:inline-block}.login{max-width:420px;margin:35px auto}.wa{background:#128c7e;color:white}.ok{background:#198754;color:white}.cancel{background:#dc3545;color:white}.muted{color:#667085}</style></head><body><header>IFRAH CABS — WhatsApp Admin</header><main>
<div id="login" class="card login"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="login()">LOGIN</button><p class="muted">Use your Firebase admin account.</p></div>
<div id="panel" style="display:none"><button onclick="logout()">LOGOUT</button><h2>Bookings</h2><div id="list">Loading...</div></div></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,getDocs,query,orderBy,doc,updateDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyD2yBDsxqzRmHzXy-G9r30UuNSquDVmZYM",
  authDomain: "ifrah-cabs.firebaseapp.com",
  projectId: "ifrah-cabs",
  storageBucket: "ifrah-cabs.firebasestorage.app",
  messagingSenderId: "1058171424992",
  appId: "1:1058171424992:web:08cfe92a8ab95f014ec085"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
window.login=()=>signInWithEmailAndPassword(auth,document.getElementById("email").value,document.getElementById("password").value).catch(e=>alert(e.message));
window.logout=()=>signOut(auth);
onAuthStateChanged(auth,u=>{document.getElementById("login").style.display=u?"none":"block";document.getElementById("panel").style.display=u?"block":"none";if(u)load()});
async function load(){let box=document.getElementById("list");box.innerHTML="";try{let snap=await getDocs(query(collection(db,"bookings"),orderBy("createdAt","desc")));if(snap.empty){box.innerHTML="<p>No bookings yet.</p>";return}snap.forEach(s=>{let b=s.data(),p=String(b.mobile||"").replace(/\D/g,""),d=document.createElement("div");d.className="card";d.innerHTML=`<h3>${b.name||""} — ${b.status||"New"}</h3><p><b>Date:</b> ${b.date||""}<br><b>Pickup:</b> ${b.pickup||""}<br><b>Drop:</b> ${b.drop||""}<br><b>Passengers:</b> ${b.passengers||""}<br><b>Time:</b> ${b.time||""}<br><b>Mobile:</b> ${b.mobile||""}</p><a class="wa" target="_blank" href="https://wa.me/${p}?text=${encodeURIComponent("Hello "+(b.name||"")+", this is IFRAH CABS regarding your Share Taxi booking.")}">WHATSAPP CUSTOMER</a><br><button class="ok" onclick="setStatus("${s.id}","Confirmed")">CONFIRM</button><button class="cancel" onclick="setStatus("${s.id}","Cancelled")">CANCEL</button>`;box.appendChild(d)})}catch(e){box.innerHTML="<p>Could not load bookings. Check Firestore rules and collection: bookings.</p>"}}
window.setStatus=async(id,v)=>{await updateDoc(doc(db,"bookings",id),{status:v});load()};
</script></body></html>
